services:
  nginx:
    image: nginx:1.27-alpine
    container_name: safaridesk_nginx
    # Stock image, non-root: the "nginx" user already exists in the image,
    # it just isn't used by default. NET_BIND_SERVICE replaces the root
    # privilege that would otherwise be needed to bind port 80; cache/run
    # dirs are tmpfs since the real filesystem paths are root-owned and
    # this image isn't rebuilt (nginx:1.27-alpine is pulled as-is, not one
    # of the two images this project publishes to Docker Hub).
    user: "101:101"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
    networks:
      - public
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/usr/share/nginx/static:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
      channels:
        condition: service_started
    restart: unless-stopped
    mem_limit: ${NGINX_MEM_LIMIT:-128m}
    cpus: ${NGINX_CPU_LIMIT:-0.5}
    healthcheck:
      # 127.0.0.1, not localhost: nginx here only listens on IPv4 (the
      # entrypoint's IPv6-listen injection can't modify the read-only
      # mounted config), but busybox wget's "localhost" tries ::1 first and
      # fails, reporting unhealthy despite the service working fine.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    container_name: safaridesk_frontend
    image: ${DOCKERHUB_NAMESPACE:-safaridesk}/safaridesk-frontend:${SAFARIDESK_IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_WS_NOTIFICATIONS_URL: ${VITE_WS_NOTIFICATIONS_URL:-}
        VITE_CHAT_WS_BASE: ${VITE_CHAT_WS_BASE:-}
        VITE_SITE_URL: ${VITE_SITE_URL:-/site}
        VITE_ALLOW_OTP: ${VITE_ALLOW_OTP:-false}
    networks:
      - public
    expose:
      - "8080"
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEM_LIMIT:-128m}
    cpus: ${FRONTEND_CPU_LIMIT:-0.5}
    healthcheck:
      # Same IPv4-vs-::1 "localhost" ambiguity as nginx's healthcheck above.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  backend:
    container_name: safaridesk_backend
    image: ${DOCKERHUB_NAMESPACE:-safaridesk}/safaridesk-backend:${SAFARIDESK_IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: gunicorn RNSafarideskBack.wsgi:application --bind 0.0.0.0:8100 --workers 3
    env_file:
      - .env
    environment:
      APP_ENV: prod
      DJANGO_SETTINGS_MODULE: RNSafarideskBack.settings.prod
    networks:
      - public
      - data
    expose:
      - "8100"
    volumes:
      - uploads:/mnt/safaridesk
      - staticfiles:/app/staticfiles
      - gunicorn_logs:/var/log/gunicorn
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: ${BACKEND_MEM_LIMIT:-768m}
    cpus: ${BACKEND_CPU_LIMIT:-1.5}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8100/api/v1/health/', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  channels:
    container_name: safaridesk_channels
    image: ${DOCKERHUB_NAMESPACE:-safaridesk}/safaridesk-backend:${SAFARIDESK_IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: daphne -b 0.0.0.0 -p 8101 RNSafarideskBack.asgi:application
    env_file:
      - .env
    environment:
      APP_ENV: prod
      DJANGO_SETTINGS_MODULE: RNSafarideskBack.settings.prod
    networks:
      - public
      - data
    expose:
      - "8101"
    volumes:
      - uploads:/mnt/safaridesk
      - staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: ${CHANNELS_MEM_LIMIT:-256m}
    cpus: ${CHANNELS_CPU_LIMIT:-0.5}

  worker:
    container_name: safaridesk_worker
    image: ${DOCKERHUB_NAMESPACE:-safaridesk}/safaridesk-backend:${SAFARIDESK_IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A RNSafarideskBack.celery worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      APP_ENV: prod
      DJANGO_SETTINGS_MODULE: RNSafarideskBack.settings.prod
    networks:
      - data
    volumes:
      - uploads:/mnt/safaridesk
      - celery_logs:/var/log/celery
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: ${WORKER_MEM_LIMIT:-512m}
    cpus: ${WORKER_CPU_LIMIT:-1.0}

  beat:
    container_name: safaridesk_beat
    image: ${DOCKERHUB_NAMESPACE:-safaridesk}/safaridesk-backend:${SAFARIDESK_IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A RNSafarideskBack.celery beat --loglevel=info
    env_file:
      - .env
    environment:
      APP_ENV: prod
      DJANGO_SETTINGS_MODULE: RNSafarideskBack.settings.prod
    networks:
      - data
    volumes:
      - uploads:/mnt/safaridesk
      - celery_logs:/var/log/celery
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: ${BEAT_MEM_LIMIT:-128m}
    cpus: ${BEAT_CPU_LIMIT:-0.25}

  db:
    container_name: safaridesk_db
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-safaridesk}
      POSTGRES_USER: ${DB_USER:-safaridesk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-db-password}
    networks:
      - data
    volumes:
      - postgresdata:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: ${DB_MEM_LIMIT:-1g}
    cpus: ${DB_CPU_LIMIT:-1.0}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-safaridesk} -d ${DB_NAME:-safaridesk}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: safaridesk_redis
    image: redis:7-alpine
    command: >
      sh -c 'if [ -n "$${REDIS_PASSWORD}" ]; then redis-server --requirepass "$${REDIS_PASSWORD}"; else redis-server; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    networks:
      - data
    volumes:
      - redisdata:/data
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    cpus: ${REDIS_CPU_LIMIT:-0.5}
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  # nginx/frontend only — never has direct network reach to db/redis.
  public:
  # backend/channels/worker/beat + db/redis. backend/channels are dual-homed
  # so nginx can reach them while they can still reach the data tier.
  data:

volumes:
  postgresdata:
  redisdata:
  uploads:
  staticfiles:
  gunicorn_logs:
  celery_logs:
  backups:
