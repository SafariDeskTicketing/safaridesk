resolver 127.0.0.11 valid=10s;

server {
    listen 8080;
    server_name safaridesk.io *.safaridesk.io;

    root /usr/share/nginx/html;
    index index.html;

    set $backend_upstream http://backend:8100;

    # Security headers. nginx resets ALL inherited add_header directives for
    # any location that declares its own, so these are repeated inside the
    # /index.html and /assets/ locations below (which already set their own
    # Cache-Control headers) rather than relying on inheritance from here.
    # See deploy/nginx/default.conf for why HSTS is deliberately omitted.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml application/xml+rss image/svg+xml;

    # Proxy uploads to API backend (docker-compose service name: backend).
    # Resolved via a variable + explicit resolver (not a literal hostname in
    # proxy_pass) so nginx doesn't eagerly resolve "backend" at config-load
    # time and crash with "host not found in upstream" if this container
    # starts before backend's DNS entry exists — it re-resolves per request
    # instead, same fix as deploy/nginx/default.conf.
    location /uploads/ {
        # No URI segment after the variable: with a variable in proxy_pass,
        # nginx skips its usual location-prefix substitution and sends
        # exactly what follows the variable, literally, for every request.
        # Omitting it entirely passes the original request URI unchanged
        # (e.g. /uploads/avatar123.png), matching default.conf's pattern.
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for large file uploads
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;

        # Increase max body size for uploads
        client_max_body_size 10M;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    error_page 404 /index.html;
}
