resolver 127.0.0.11 valid=10s;

server {
    listen 8080;
    server_name safaridesk.io *.safaridesk.io;

    root /usr/share/nginx/html;
    index index.html;

    set $backend_upstream http://backend:8100;

    # Proxy uploads to API backend (docker-compose service name: backend).
    # Resolved via a variable + explicit resolver (not a literal hostname in
    # proxy_pass) so nginx doesn't eagerly resolve "backend" at config-load
    # time and crash with "host not found in upstream" if this container
    # starts before backend's DNS entry exists — it re-resolves per request
    # instead, same fix as deploy/nginx/default.conf.
    location /uploads/ {
        proxy_pass $backend_upstream/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for large file uploads
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;

        # Increase max body size for uploads
        client_max_body_size 10M;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    error_page 404 /index.html;
}
