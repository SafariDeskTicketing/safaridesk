name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: safaridesk
          POSTGRES_USER: safaridesk
          POSTGRES_PASSWORD: safaridesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safaridesk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # .env.example already has every value config() needs with no default
      # (SECRET_KEY, EMAIL_*, SUPERUSER_*, CORE_*, ...); only the handful
      # that must point at CI's own service containers get overridden.
      - name: Write test environment
        run: |
          cp ../.env.example .env
          sed -i \
            -e 's/^APP_ENV=.*/APP_ENV=dev/' \
            -e 's/^DB_HOST=.*/DB_HOST=localhost/' \
            -e 's/^DB_NAME=.*/DB_NAME=safaridesk/' \
            -e 's/^DB_USER=.*/DB_USER=safaridesk/' \
            -e 's/^DB_PASSWORD=.*/DB_PASSWORD=safaridesk/' \
            -e 's/^REDIS_HOST=.*/REDIS_HOST=localhost/' \
            -e 's#^CELERY_BROKER_URL=.*#CELERY_BROKER_URL=redis://localhost:6379/0#' \
            -e 's#^CELERY_RESULT_BACKEND=.*#CELERY_RESULT_BACKEND=redis://localhost:6379/0#' \
            .env

      - run: python manage.py check

      # Non-blocking for now, same reason as the frontend lint/type-check
      # steps below: running this same command against the live dev stack
      # (docker exec safaridesk_backend python manage.py test, no code
      # changes) surfaced a pre-existing 21/166 failure+error rate, unrelated
      # to this workflow - see PROGRESS.md's "manage.py test has 21 pre-
      # existing failures" item for the categorized breakdown. Flip to
      # blocking once that backlog is triaged.
      - name: "Test (non-blocking until the pre-existing 21/166 backlog is triaged)"
        run: python manage.py test
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Non-blocking for now: the codebase has a tracked, pre-existing
      # backlog of ~480 lint errors (mostly `: any`, see PROGRESS.md's
      # "Reduce : any usage" item) that a from-day-one blocking lint step
      # would fail on immediately, for every PR, regardless of content.
      # Flip this to a hard failure once that backlog is cleared.
      - name: "Lint (non-blocking until the `any` backlog is cleared)"
        run: npm run lint
        continue-on-error: true

      # Also non-blocking for now, same reason as lint above: tsc -p
      # tsconfig.app.json (the config that actually type-checks, not the
      # bare root tsconfig.json solution file) currently reports several
      # hundred pre-existing errors in legacy files. `npm run build` below
      # is the real gate - Vite/esbuild transpiles but does not type-check,
      # so this step is what gives a type-error regression any visibility
      # at all until the backlog is cleared and this can be made blocking.
      - name: Type-check (non-blocking until the pre-existing backlog is cleared)
        run: npx tsc -p tsconfig.app.json --noEmit
        continue-on-error: true

      - run: npm run build
