# Re-resolve upstream hostnames per-request against Docker's embedded DNS
# instead of once at config-load time, so a container recreate (new IP)
# doesn't require a manual `docker compose restart nginx` to clear 502s.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    set $backend_upstream http://backend:8100;
    set $channels_upstream http://channels:8101;
    set $frontend_upstream http://frontend:8080;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }

    location /ws/ {
        proxy_pass $channels_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600;
    }

    location /uploads/ {
        proxy_pass $backend_upstream;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }

    location /static/ {
        alias /usr/share/nginx/static/;
        try_files $uri =404;
    }

    location /swagger/ {
        proxy_pass $backend_upstream;
    }

    location /redoc/ {
        proxy_pass $backend_upstream;
    }

    location / {
        proxy_pass $frontend_upstream;
    }
}
