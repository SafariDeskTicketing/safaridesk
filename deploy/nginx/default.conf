# Re-resolve upstream hostnames per-request against Docker's embedded DNS
# instead of once at config-load time, so a container recreate (new IP)
# doesn't require a manual `docker compose restart nginx` to clear 502s.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    set $backend_upstream http://backend:8100;
    set $channels_upstream http://channels:8101;
    set $frontend_upstream http://frontend:8080;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Security headers. No location block below sets its own add_header, so
    # these apply everywhere without nginx's "add_header in a location resets
    # all inherited ones" gotcha. HSTS is intentionally omitted — this is a
    # plain :80 server block (see PROGRESS.md's "no TLS yet" item); adding it
    # before HTTPS is enforced would make browsers refuse to fall back to
    # HTTP, breaking the only scheme this currently serves.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml application/xml+rss image/svg+xml;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }

    location /ws/ {
        proxy_pass $channels_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600;
    }

    location /uploads/ {
        proxy_pass $backend_upstream;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }

    location /static/ {
        alias /usr/share/nginx/static/;
        try_files $uri =404;
    }

    location /swagger/ {
        proxy_pass $backend_upstream;
    }

    location /redoc/ {
        proxy_pass $backend_upstream;
    }

    location / {
        proxy_pass $frontend_upstream;
    }
}
