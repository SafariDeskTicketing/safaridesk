# Advanced split-domain example.
# Use this when app and API live on different hostnames.

resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name app.example.com;

    set $frontend_upstream http://frontend:8080;

    # See default.conf for why HSTS is deliberately omitted until TLS lands.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml application/xml+rss image/svg+xml;

    location / {
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    server_name api.example.com;

    client_max_body_size 10M;

    set $backend_upstream http://backend:8100;
    set $channels_upstream http://channels:8101;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain application/javascript application/json application/xml application/xml+rss;

    location /api/ {
        proxy_pass $backend_upstream;
    }

    location /ws/ {
        proxy_pass $channels_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600;
    }

    location /uploads/ {
        proxy_pass $backend_upstream;
    }

    location /swagger/ {
        proxy_pass $backend_upstream;
    }

    location /redoc/ {
        proxy_pass $backend_upstream;
    }
}
