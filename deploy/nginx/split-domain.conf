# Advanced split-domain example.
# Use this when app and API live on different hostnames.

resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name app.example.com;

    set $frontend_upstream http://frontend:8080;

    location / {
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    server_name api.example.com;

    client_max_body_size 10M;

    set $backend_upstream http://backend:8100;
    set $channels_upstream http://channels:8101;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location /api/ {
        proxy_pass $backend_upstream;
    }

    location /ws/ {
        proxy_pass $channels_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600;
    }

    location /uploads/ {
        proxy_pass $backend_upstream;
    }

    location /swagger/ {
        proxy_pass $backend_upstream;
    }

    location /redoc/ {
        proxy_pass $backend_upstream;
    }
}
